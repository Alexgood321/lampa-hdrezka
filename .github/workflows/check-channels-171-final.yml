name: Verify HDRezka Channels 1.7.1 final
on:
  pull_request:
    branches: [main]
jobs:
  published:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Verify pinned JS and channels integration
        run: |
          set -eu
          curl -fsS -D /tmp/headers --max-time 25 -H "Origin: https://lampa.mx" \
            "https://cdn.jsdelivr.net/gh/Alexgood321/lampa-hdrezka@c7c48fcab739f79c3a9c3b2522deaa3cebaedd6d/rezka.js" \
            -o /tmp/rezka.js
          grep -q "version: '1.7.1'" /tmp/rezka.js
          grep -q 'hdrezka_nav_watchlist' /tmp/rezka.js || grep -q "'hdrezka_nav_' + item.key" /tmp/rezka.js
          grep -q 'Some Lampa distributions use another component ID' /tmp/rezka.js
          grep -qi '^access-control-allow-origin: \*' /tmp/headers
          node --check /tmp/rezka.js
          echo "Final HDRezka Channels 1.7.1 CDN verified"
