name: Validate HDRezka plugin and bridges
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install serverless dependencies
        run: npm install --no-audit --ignore-scripts
      - name: JavaScript syntax
        run: npm run check
      - name: Bridge tests
        run: npm test
