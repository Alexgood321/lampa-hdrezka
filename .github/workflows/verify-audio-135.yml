name: Verify HDRezka dubbed audio 1.3.5
on:
  pull_request:
    branches: [main]
jobs:
  published:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check Netlify public version, CORS and syntax
        run: |
          set -eu
          curl -fsS -D /tmp/headers --max-time 25 \
            -H "Origin: https://lampa.mx" \
            "https://alexgood321-rezka-lampa.netlify.app/rezka.js?v=135" -o /tmp/rezka.js
          grep -q "version: '1.3.5'" /tmp/rezka.js
          grep -q "getElementById('translators-list')" /tmp/rezka.js
          grep -qi "^access-control-allow-origin: \*" /tmp/headers
          node --check /tmp/rezka.js
          echo "HDRezka dubbing plugin 1.3.5 published and valid"
