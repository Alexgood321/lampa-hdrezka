name: Verify HDRezka dubbing 1.3.5 from jsDelivr
on:
  pull_request:
    branches: [main]
jobs:
  published:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check published pinned JS, CORS, source and syntax
        run: |
          set -eu
          curl -fsS -D /tmp/headers --max-time 25 \
            -H "Origin: https://lampa.mx" \
            "https://cdn.jsdelivr.net/gh/Alexgood321/lampa-hdrezka@52eff2d3a17204b681899f84bf542c0c47d7eeb3/rezka.js" -o /tmp/rezka.js
          grep -q "version: '1.3.5'" /tmp/rezka.js
          grep -q "getElementById('translators-list')" /tmp/rezka.js
          grep -qi "^access-control-allow-origin: \*" /tmp/headers
          node --check /tmp/rezka.js
          echo "HDRezka 1.3.5 pinned CDN: available"
