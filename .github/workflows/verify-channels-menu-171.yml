name: Verify HDRezka channels navigation 1.7.1
on:
  pull_request:
    branches: [main]
jobs:
  published:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Verify pinned JS
        run: |
          set -eu
          curl -fsS -D /tmp/headers --max-time 25 -H "Origin: https://lampa.mx" \
            "https://cdn.jsdelivr.net/gh/Alexgood321/lampa-hdrezka@1dc38d15867e776a1d560f935a18c69f6d71980f/rezka.js" \
            -o /tmp/rezka.js
          grep -q "version: '1.7.1'" /tmp/rezka.js
          grep -q 'function rezkaChannelsSettingsRegister' /tmp/rezka.js
          grep -q 'function rezkaNavRegister' /tmp/rezka.js
          grep -qi '^access-control-allow-origin: \*' /tmp/headers
          node --check /tmp/rezka.js
          echo "Verified HDRezka 1.7.1 pinned JS"
