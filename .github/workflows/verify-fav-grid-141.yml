name: Verify HDRezka poster grid 1.4.1
on:
  pull_request:
    branches: [main]
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check pinned JavaScript is available with CORS
        run: |
          set -eu
          curl -fsS --max-time 25 -D /tmp/headers \
            -H "Origin: https://lampa.mx" \
            "https://cdn.jsdelivr.net/gh/Alexgood321/lampa-hdrezka@26f30b5daeb9eec5b5c635b5fdaf36b53d95e009/rezka.js" \
            -o /tmp/rezka.js
          grep -q "version: '1.4.1'" /tmp/rezka.js
          grep -q 'rezka-fav-grid' /tmp/rezka.js
          grep -qi "^access-control-allow-origin: \*" /tmp/headers
          node --check /tmp/rezka.js
          echo "HDRezka 1.4.1 pinned JS published and valid"
