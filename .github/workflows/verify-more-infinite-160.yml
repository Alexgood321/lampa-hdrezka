name: Verify native HDRezka more and infinite scroll 1.6.0
on:
  pull_request:
    branches: [main]
jobs:
  published:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check pinned plugin v1.6.0
        run: |
          set -eu
          curl -fsS --max-time 25 -D /tmp/headers -H "Origin: https://lampa.mx" \
            "https://cdn.jsdelivr.net/gh/Alexgood321/lampa-hdrezka@f852d006d36fb926da1011fb6fbaea42220066af/rezka.js" -o /tmp/rezka.js
          grep -q "version: '1.6.0'" /tmp/rezka.js
          grep -q 'onlyMore: full' /tmp/rezka.js
          grep -q 'scroll.onEnd = loadNextPage' /tmp/rezka.js
          grep -qi '^access-control-allow-origin: \*' /tmp/headers
          node --check /tmp/rezka.js
          echo "HDRezka 1.6.0 pinned CDN available"
