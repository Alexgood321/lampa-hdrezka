name: Verify published favorites plugin
on:
  pull_request:
    branches: [main]
jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check public Netlify plugin URL
        run: |
          curl --fail-with-body --silent --show-error --max-time 20 \
            https://alexgood321-rezka-lampa.netlify.app/rezka.js \
            -o /tmp/lampa-rezka.js
          grep -q "version: '1.3.1'" /tmp/lampa-rezka.js
          node --check /tmp/lampa-rezka.js
          echo "Published JS version 1.3.1: OK"
