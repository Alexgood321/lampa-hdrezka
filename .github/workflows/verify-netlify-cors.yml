name: Verify Lampa JS static CORS on Netlify
on:
  pull_request:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Verify JS is accessible and can be inspected by cross-origin XHR
        run: |
          set -eu
          url="https://alexgood321-rezka-lampa.netlify.app/rezka.js"
          curl -fsS -D /tmp/headers --max-time 25 \
            -H 'Origin: https://lampa.mx' "$url" -o /tmp/rezka.js
          grep -qi '^access-control-allow-origin: \*' /tmp/headers
          grep -q "version: '1.3.1'" /tmp/rezka.js
          node --check /tmp/rezka.js
          echo "JS HTTP 200, Access-Control-Allow-Origin: *, syntax and version OK"
