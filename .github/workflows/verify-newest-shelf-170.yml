name: Verify HDRezka newest shelf 1.7.0
on:
  pull_request:
    branches: [main]
jobs:
  pinned-cdn:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check published HDRezka newest plugin
        run: |
          set -eu
          curl -fsS --max-time 25 -D /tmp/headers -H "Origin: https://lampa.mx" \
            "https://cdn.jsdelivr.net/gh/Alexgood321/lampa-hdrezka@df85a7eb4d5a403a09eda34792fde0205327bf9b/rezka.js" -o /tmp/rezka.js
          grep -q "version: '1.7.0'" /tmp/rezka.js
          grep -q "hdrezka_newest" /tmp/rezka.js
          grep -q "b-newest_slider__list" /tmp/rezka.js
          grep -qi '^access-control-allow-origin: \*' /tmp/headers
          node --check /tmp/rezka.js
          echo "HDRezka v1.7.0 newest plugin available"
