name: Verify live HDRezka player 1.3.3
on:
  pull_request:
    branches: [main]
jobs:
  production:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check published Netlify plugin syntax and version
        run: |
          set -eu
          curl -fsS -D /tmp/headers --max-time 25 \
            -H "Origin: https://lampa.mx" \
            "https://alexgood321-rezka-lampa.netlify.app/rezka.js?v=133" \
            -o /tmp/rezka.js
          grep -qi "^access-control-allow-origin: \*" /tmp/headers
          grep -q "version: '1.3.3'" /tmp/rezka.js
          node --check /tmp/rezka.js
          echo "HDRezka 1.3.3 published with CORS and valid JavaScript"
