name: Verify HDRezka Premium badges 1.3.6
on:
  pull_request:
    branches: [main]
jobs:
  published:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check published pinned CDN JS
        run: |
          set -eu
          curl -fsS -D /tmp/headers --max-time 25 \
            -H "Origin: https://lampa.mx" \
            "https://cdn.jsdelivr.net/gh/Alexgood321/lampa-hdrezka@ed6ed98c3b88a09dbb71f0ae0a7fe99bd9e63da4/rezka.js" -o /tmp/rezka.js
          grep -q "version: '1.3.6'" /tmp/rezka.js
          grep -q 'b-prem_translator' /tmp/rezka.js
          grep -qi "^access-control-allow-origin: \*" /tmp/headers
          node --check /tmp/rezka.js
          echo "HDRezka 1.3.6 premium badge plugin available"
