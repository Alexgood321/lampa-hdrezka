name: Verify HDRezka plugin 1.3.4 published
on:
  pull_request:
    branches: [main]
jobs:
  published:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check version, CORS and script parse
        run: |
          set -eu
          curl -fsS --max-time 25 -D /tmp/headers \
            -H "Origin: https://lampa.mx" \
            "https://alexgood321-rezka-lampa.netlify.app/rezka.js?v=134" \
            -o /tmp/rezka.js
          grep -q "version: '1.3.4'" /tmp/rezka.js
          grep -qi "^access-control-allow-origin: \*" /tmp/headers
          node --check /tmp/rezka.js
          if grep -q 'Lampa.Utils.escape(' /tmp/rezka.js; then
            echo "Unsupported Lampa.Utils.escape still in plugin"; exit 1
          fi
          echo "1.3.4 available, valid JavaScript, no Lampa.Utils.escape"
