[build]
  command = "cp rezka.js public/rezka.js"
  publish = "public"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Lampa checks external plugins with XHR, which requires CORS.
# These headers apply only to the public JS file, not authenticated API routes.
[[headers]]
  for = "/rezka.js"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, HEAD, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type"
    Cache-Control = "public, max-age=60, must-revalidate"
